schema: spec-driven

context: |
  PROJECT: Spacekeeper (repository zen-spacekeeper)

  Automatic domain-based tab grouping in the Zen Browser, respecting the browser's
  Spaces (workspaces).

  LANGUAGE
  Everything written in this repository is in English: specification, proposals,
  code, identifiers, comments, commit messages and user-visible text. The only
  exception is openspec/changes/archive/, kept in Portuguese as the record of
  decisions made before that rule existed; it is never retranslated.

  ORIGIN
  The starting point is the Auto Tab Groups extension
  (github.com/nitzanpap/auto-tab-groups), which groups by domain but is blind to
  Spaces: it indexes groups by domain alone, so opening youtube.com in Space 2 gets
  the tab adopted by the "youtube" group that already exists in Space 1 — and the
  tab is dragged into Space 1 along with it.

  ROOT CAUSE (verified in the installed Zen's omni.ja)
  Each Space has its own tab container in the DOM
  (gZenWorkspaces.activeWorkspaceElement.tabsContainer, in
  modules/zen/ZenSpaceManager.mjs). A group lives physically inside one Space's
  strip, so group.addTabs() reparents the tab into that Space. The fix is to index
  groups by (Space, key) instead of by key alone.

  ARCHITECTURE DECISIONS
  - Not an extension: the WebExtensions API (browser.tabs.group) does not expose
    Zen's Spaces.
  - Not an official Zen Mod: marketplace mods are CSS + preferences.json and do not
    execute JS.
  - It is a privileged chrome script (.uc.mjs) loaded by fx-autoconfig.
  - Uses gBrowser.addTabGroup (a regular group, tabs stay unpinned), NOT
    gZenFolders.createFolder — that one calls pinTab and would pin every grouped tab.
  - Group identity comes from attributes (zstg-key + zen-workspace-id), never from
    the visible label, so the user can rename groups without breaking the matching.

  ZEN INTERNAL API IN USE
  - Active Space (uuid): gZenWorkspaces.activeWorkspace
  - A tab's Space: the zen-workspace-id attribute on the <tab>
  - The Space's tab container: gZenWorkspaces.activeWorkspaceElement.tabsContainer
  - Create a regular group: gBrowser.addTabGroup(tabs, { label, color, insertBefore })
  - Existing groups: gBrowser.tabGroups
  - Native Zen folder: gZenFolders.createFolder() — pins the tabs, not used

  NAMES THAT MUST NEVER CHANGE
  Renaming any of these silently breaks the groups users already have on screen,
  because they are the stored identity:
  - the zstg-key and zen-workspace-id attributes
  - the zen.stg. preference prefix and every preference name under it
  - the "host" and "sub" values of zen.stg.subdomainLabel

  DEVELOPMENT ENVIRONMENT
  - The author develops on Windows 11, with Zen in C:\Program Files\Zen Browser.
  - The product is meant to work on Windows, macOS and Linux; a change that only
    works on one of them is incomplete.

  CONVENTIONS
  - Every behavior change goes through a proposal before implementation.
  - scripts/verify.mjs must pass before a change is archived.
  - Verification tasks that require a running browser are never marked complete
    from code reading alone — only the user confirms those.

# Per-artifact rules (optional)
rules:
  proposal:
    - Write in English.
    - State what is out of scope explicitly.
  design:
    - Write in English.
    - Record why a decision was taken, not only what was decided; a rejected
      alternative is worth naming.
    - State the cost of a decision plainly instead of softening it.
  tasks:
    - Write in English.
    - Keep tasks that need a running browser in a section of their own, so it is
      clear they cannot be verified by reading code.
  specs:
    - Write in English. SHALL, GIVEN, WHEN, THEN and AND stay uppercase.

operations:
  apply:
    guidance:
      - Run scripts/verify.mjs after implementing, and report its actual output.
      - Never mark a browser-verification task complete without the user saying so.
  archive:
    guidance:
      - Do not archive while browser-verification tasks are still unchecked.
